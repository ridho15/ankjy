name: CI, Build Image & Deploy to Portainer

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test-and-verify:
    name: Run Tests & Build Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slm
          POSTGRES_USER: slm
          POSTGRES_PASSWORD: slm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://slm:slm@localhost:5432/slm?schema=public"

      - name: Deploy Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://slm:slm@localhost:5432/slm?schema=public"

      - name: Run Test Suite
        run: npm test
        env:
          DATABASE_URL: "postgresql://slm:slm@localhost:5432/slm?schema=public"

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://slm:slm@localhost:5432/slm?schema=public"

  build-and-push-ghcr:
    name: Build & Push Docker Image to GHCR
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case repository name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-portainer:
    name: Trigger Portainer Auto-Deploy Webhook
    needs: [test-and-verify, build-and-push-ghcr]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Call Portainer Webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::warning::Secret PORTAINER_WEBHOOK_URL belum disetel di GitHub Repository Secrets. Lewati webhook trigger."
            echo "Image GHCR berhasil dibuat dan siap di-pull manual atau via webhook jika secret sudah diisi."
            exit 0
          fi

          echo "🚀 Menghubungi Webhook Portainer untuk trigger auto-redeploy..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL")

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat response.txt

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo ""
            echo "✅ Berhasil memicu Portainer! Image GHCR terbaru sedang di-pull dan di-deploy otomatis oleh Portainer."
          else
            echo ""
            echo "::warning::Webhook Portainer mengembalikan status HTTP $HTTP_STATUS"
            exit 0
          fi
